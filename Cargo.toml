[package]
name = "botkit"
version = "0.1.1"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Unified Rust bot framework with optional Discord, Telegram, and Matrix adapters"
autoexamples = false
keywords = ["bot", "discord", "telegram", "matrix"]
categories = ["asynchronous", "api-bindings"]

[workspace]
resolver = "2"
members = ["core", "cli", "discord", "telegram", "matrix", "examples"]
# See examples/webhook/Cargo.toml: skyzen and matrix-sdk both pull a package
# that links `sqlite3`, and cargo rejects that across a whole workspace.
exclude = ["examples/webhook"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lexoliu/botkit"

[workspace.dependencies]
# Internal crates
botkit-core = { version = "0.2.0", path = "core" }
botkit-discord = { version = "0.2.0", path = "discord" }
botkit-telegram = { version = "0.2.0", path = "telegram" }
botkit-matrix = { version = "0.2.0", path = "matrix" }
botkit-cli = { version = "0.1.1", path = "cli" }

# HTTP foundation
http-kit = "0.4.2"
zenwave = "0.5.0"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
mime_guess = "2.0.5"

# Error handling
thiserror = "2.0.20"

# Async runtime
futures-lite = "2.6"
executor-core = "0.7.1"

[features]
default = []
discord = ["dep:botkit-discord"]
telegram = ["dep:botkit-telegram"]
matrix = ["dep:botkit-matrix"]
cli = ["dep:botkit-cli"]
full = ["discord", "telegram", "matrix", "cli"]

[dependencies]
botkit-core.workspace = true
botkit-discord = { workspace = true, optional = true }
botkit-telegram = { workspace = true, optional = true }
botkit-matrix = { workspace = true, optional = true }
botkit-cli = { workspace = true, optional = true }
