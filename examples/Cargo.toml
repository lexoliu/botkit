[package]
name = "botkit-examples"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "unified"
path = "unified.rs"

[[bin]]
name = "telegram_webhook"
path = "telegram_webhook.rs"

[[bin]]
name = "telegram_polling"
path = "telegram_polling.rs"

[[bin]]
name = "telegram_typing_and_files"
path = "telegram_typing_and_files.rs"

[[bin]]
name = "matrix"
path = "matrix.rs"

[dependencies]
async-executor = "1"
ctrlc = "3"
async-fs = "2"
async-io = "2"
botkit-core.workspace = true
botkit-discord = { path = "../discord" }
botkit-telegram = { path = "../telegram" }
botkit-matrix = { path = "../matrix" }
tracing-subscriber = "0.3"
skyzen.workspace = true
# Pinned transitively; see the workspace manifest.
skyzen-core.workspace = true
skyzen-macros.workspace = true
futures-lite.workspace = true
executor-core.workspace = true
