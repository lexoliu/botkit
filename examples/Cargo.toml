[package]
name = "botkit-examples"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "telegram_polling"
path = "telegram_polling.rs"

[[bin]]
name = "telegram_typing_and_files"
path = "telegram_typing_and_files.rs"

[[bin]]
name = "discord"
path = "discord.rs"

[[bin]]
name = "matrix"
path = "matrix.rs"

[dependencies]
botkit-core.workspace = true
botkit-discord.workspace = true
botkit-telegram.workspace = true
botkit-matrix.workspace = true
async-executor = "1.14"
async-fs = "2.2"
async-io = "2.6"
ctrlc = "3.5"
futures-lite.workspace = true
# `async-executor` teaches executor-core how to drive an `async_executor::Executor`.
executor-core = { workspace = true, features = ["async-executor"] }
tracing-subscriber = "0.3.23"
